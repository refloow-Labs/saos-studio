server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The CRM and every generated demo site are in Greek. Without this, nginx
    # serves text/* without a charset and browsers fall back to latin-1.
    charset       utf-8;
    charset_types text/html text/css text/plain text/javascript
                  application/javascript application/json;

    # Rewritten by the agent's sync-to-crm step — a cached copy would hide
    # freshly generated drafts.
    location = /agent-drafts.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Generated demo sites; regenerated per run, so don't let them stick.
    location /agent-drafts/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
