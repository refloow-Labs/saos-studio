<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--seo-head-->
    <title>SAOS Studio — Δωρεάν αξιολόγηση ιστοσελίδας & κατασκευή websites</title>
    <meta
      name="description"
      content="Δείτε δωρεάν τι μπορείτε να βελτιώσετε στην ιστοσελίδα σας — ταχύτητα, εμφάνιση στο κινητό, SEO. Σχεδιασμός, κατασκευή και προώθηση ιστοσελίδων για μικρές επιχειρήσεις στην Ελλάδα."
    />
    <!--/seo-head-->

    <!-- Manrope is self-hosted (see src/index.css) so first paint doesn't wait
         on a third-party stylesheet round trip. -->
    <link
      rel="preload"
      href="/fonts/manrope-greek-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-greek-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Google Analytics + Consent Mode v2 — default DENIED until user grants -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
