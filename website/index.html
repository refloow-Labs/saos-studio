<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--seo-head-->
    <title>Κατασκευή ιστοσελίδων στην Αλεξανδρούπολη — SAOS Studio</title>
    <meta
      name="description"
      content="Ιστοσελίδες για μικρές επιχειρήσεις στη Θράκη. Πληρώνετε μία φορά για την κατασκευή και είναι δική σας — το μηνιαίο SEO είναι προαιρετικό."
    />
    <!--/seo-head-->

    <!-- Manrope is self-hosted (see src/index.css) so first paint doesn't wait
         on a third-party stylesheet round trip. -->
    <link
      rel="preload"
      href="/fonts/manrope-greek-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/manrope-greek-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Google Analytics + Consent Mode v2 — default DENIED until user grants -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        personalization_storage: 'denied',
        security_storage: 'granted',
        wait_for_update: 500
      });
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Netlify Forms static detection. index.html is the prerender template
         (see CLAUDE.md), so these hidden forms ship on every route and let
         Netlify's build-time HTML scan register the three forms the app posts
         to at runtime via fetch (src/lib/submit.ts). Field names here must
         match the SubmitPayload keys exactly, or Netlify accepts the POST but
         drops the fields it never declared. -->
    <form name="application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="business" />
      <input type="text" name="name" />
      <input type="text" name="industry" />
      <input type="email" name="email" />
      <input type="text" name="contact" />
      <input type="text" name="website" />
      <input type="text" name="template" />
      <input type="text" name="bot-field" />
    </form>
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="text" name="industry" />
      <input type="text" name="need" />
      <input type="text" name="website" />
      <input type="email" name="email" />
      <input type="text" name="project" />
      <input type="text" name="bot-field" />
    </form>
    <form name="evaluation" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="website" />
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
